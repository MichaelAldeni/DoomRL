# Doom Scenario Configuration for Speedrun Agent

# 1. Path to the map (can be overwritten in Python)
doom_scenario_path = doom.wad
doom_map = e1m1

# 2. Rendering Options
# Using a smaller resolution speeds up the CNN processing.
# Grayscale is sufficient for speedrunning (geometry matters more than color).
screen_resolution = RES_160X120
screen_format = GRAY8
render_hud = false
render_crosshair = false
render_weapon = true
render_decals = false
render_particles = false
window_visible = false

# 3. Available Actions
# For speedrunning, we add TURN_LEFT_RIGHT_DELTA for smoother turning if needed,
# but stick to discrete buttons for A3C.
available_buttons = 
	{ 
		MOVE_LEFT 
		MOVE_RIGHT 
		ATTACK 
	}

# 4. Game Variables (CRITICAL for your Python Reward Handler)
# We MUST expose these so game.get_game_variable(POSITION_X) works.
available_game_variables = 
	{ 
		HEALTH 
		POSITION_X 
		POSITION_Y 
		VELOCITY_X 
		VELOCITY_Y 
	}

# 5. Native Rewards (The "Base" Layer)
# We handle the "Time Pressure" here directly in the engine.
# living_reward = -0.1 is equivalent to your Python "reward -= 0.1"
living_reward = -0.1

# We add a small death penalty to discourage simply dying to reset the loop.
death_penalty = 10.0

# 6. Episode Termination
# Cap the episode at 2100 ticks (approx 1 minute) to prevent getting stuck.
episode_timeout = 2100

# 7. Game Settings
mode = PLAYER
doom_skill = 5